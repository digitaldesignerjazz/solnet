[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solnet"
version = "0.1.0"
description = "SolNet - Decentralized networking and hyperspace integration layer for Nexus AI agent swarms, Yggdrasil mesh coordination, and NovaNet/xMesh/QNET ecosystem."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sven Normen Esslinger / Esslinger & Co." }
]
requires-python = ">=3.10"
keywords = ["mesh-network", "yggdrasil", "hyperspace", "ai-agents", "swarm-intelligence", "decentralized", "privacy", "nexus", "qnet", "esslinger"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "cryptography>=42.0.0",
    "PyNaCl>=1.5.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
solnet-demo = "solnet.cli:main"

[project.urls]
Homepage = "https://github.com/digitaldesignerjazz/solnet"
Repository = "https://github.com/digitaldesignerjazz/solnet"
Documentation = "https://github.com/digitaldesignerjazz/solnet/tree/main/docs"
Issues = "https://github.com/digitaldesignerjazz/solnet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.mypy]
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
