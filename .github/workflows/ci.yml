name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check src examples

    - name: Format check with Black
      run: black --check src examples

    - name: Type check with mypy
      run: mypy src

    - name: Test with pytest
      run: pytest --tb=short -q

    - name: Smoke test console script
      run: |
        solnet-demo version
        solnet-demo demo

    - name: Smoke test examples (offline paths)
      run: |
        python -m examples.basic_integration 2>&1 | cat
        python -m examples.emotional_swarm_simulation 2>&1 | head -30
        python -m examples.hardware_sensor_loop 2>&1 | cat
      # Note: examples use asyncio.run and may be long; head for one is fine for CI smoke
